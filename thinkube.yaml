apiVersion: thinkube.io/v1
kind: ThinkubeDeployment
metadata:
  # The application's version; the generated app starts at it.
  version: "0.1.0"

spec:
  deployment:
    type: app

  containers:
    - name: seaweedfs-gateway
      build: .
      port: 8080
      size: small
      health: /api/health
      test:
        enabled: false

  routes:
    - path: /
      to: seaweedfs-gateway
